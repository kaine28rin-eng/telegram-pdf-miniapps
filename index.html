<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STUDYX · PDF Viewer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/pdf.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';
    pdfjsLib.GlobalWorkerOptions.fallbackOnBlobSupport = false;
    pdfjsLib.GlobalWorkerOptions.fallbackOnFontFace = false;
  </script>
  <style>
    :root {
      --bg: #0b0c10;
      --accent-grad: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --card-border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
    }
    /* ===== Flipbook Viewer ===== */
    #flipbookView {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 200; padding: 0; margin: 0;
      display: flex; flex-direction: column;
    }
    .flipbook-header {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; z-index: 10; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
    }
    .flipbook-title { font-size: 16px; font-weight: 700; color: #fff; }
    .flipbook-close {
      background: rgba(255,255,255,0.1); border: 1px solid var(--card-border);
      color: #fff; width: 36px; height: 36px; border-radius: 10px;
      font-size: 18px; cursor: pointer; display: flex; align-items: center;
      justify-content: center;
    }
    .download-btn {
      background: var(--accent-grad); border: none; color: #fff;
      padding: 6px 14px; border-radius: 8px; font-size: 12px;
      font-weight: 700; cursor: pointer; margin-right: 8px;
    }
    .page-container {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90vw; max-width: 500px; height: 95vh; max-height: 700px;
      perspective: 1200px; perspective-origin: center;
    }
    .page-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      background: #fff;
    }
    .page-shadow {
      position: absolute; bottom: -5px; left: 0; width: 100%; height: 10px;
      background: rgba(0,0,0,0.3); border-radius: 50%; filter: blur(2px);
      opacity: 0.5;
    }
    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255,255,255,0.1); border: 1px solid var(--card-border);
      color: #fff; display: flex; align-items: center;
      justify-content: center; font-size: 18px; cursor: pointer; z-index: 5;
    }
    .nav-prev { left: -60px; }
    .nav-next { right: -60px; }
    .page-indicator {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.7); font-size: 14px; padding: 8px 16px;
      background: rgba(0,0,0,0.3); border-radius: 20px;
    }
    .loading-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(255, 75, 43, 0.9); font-size: 16px; font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Flipbook Viewer — single PDF, opens directly from ?book= param -->
  <div id="flipbookView">
    <div class="flipbook-header">
      <span class="flipbook-title" id="flipbookTitle">Loading...</span>
      <div>
        <a id="downloadBtn" class="download-btn" href="#" download>Download</a>
        <span class="flipbook-close" onclick="closeFlipbook()">✕</span>
      </div>
    </div>
    <div class="page-container" id="pageContainer">
      <div class="loading-overlay" id="loadingOverlay">Loading PDF...</div>
      <canvas class="page-canvas" id="pageCanvas"></canvas>
      <div class="page-shadow"></div>
      <div class="nav-btn nav-prev" onclick="prevPage()">‹</div>
      <div class="nav-btn nav-next" onclick="nextPage()">›</div>
      <div class="page-indicator" id="pageIndicator">Page — / —</div>
    </div>
  </div>

  <script>
    // Telegram Web App init
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    // ===== PDF.js State =====
    let pdfDoc = null;
    let currentPage = 1;
    let pageCount = 0;
    let pageRendering = false;
    let pageNumPending = null;
    const scale = 1.5;
    let pdfLoadingTask = null;

    // ===== Flipbook Viewer Functions =====
    function openFlipbook(pdfPath, title) {
      document.getElementById('flipbookTitle').innerText = title;
      document.getElementById('pageIndicator').innerText = 'Loading...';
      document.getElementById('loadingOverlay').style.display = 'block';
      document.getElementById('pageCanvas').style.display = 'none';
      const dlBtn = document.getElementById('downloadBtn');
      dlBtn.href = pdfPath;
      dlBtn.download = title + '.pdf';
      loadPdf(pdfPath);
    }

    function closeFlipbook() {
      if (pdfDoc) { pdfDoc.destroy(); pdfDoc = null; }
      if (pdfLoadingTask) { pdfLoadingTask.destroy(); pdfLoadingTask = null; }
      if (tg) { tg.close(); }
    }

    function showFlipbookError(msg) {
      const canvas = document.getElementById('pageCanvas');
      const ctx = canvas.getContext('2d');
      if (canvas.width === 0 || canvas.height === 0) {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth || 500;
        canvas.height = container.clientHeight || 700;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff4b2b';
      ctx.font = '16px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const lines = msg.split('\n');
      lines.forEach((line, i) => {
        ctx.fillText(line, canvas.width / 2, canvas.height / 2 - (lines.length - 1) * 12 + i * 24);
      });
      document.getElementById('loadingOverlay').style.display = 'none';
      document.getElementById('pageCanvas').style.display = 'block';
      document.getElementById('pageIndicator').innerText = 'Error';
    }

    function loadPdf(pdfPath) {
      if (typeof pdfjsLib !== 'undefined' && pdfjsLib.GlobalWorkerOptions) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';
      }
      if (pdfLoadingTask) {
        pdfLoadingTask.destroy();
        pdfLoadingTask = null;
      }
      pdfLoadingTask = pdfjsLib.getDocument({ url: pdfPath });
      pdfLoadingTask.promise.then(pdf => {
        pdfDoc = pdf;
        pageCount = pdf.numPages;
        currentPage = 1;
        document.getElementById('pageIndicator').innerText = `Page 1 / ${pageCount}`;
        renderPage();
      }).catch(err => {
        console.error('PDF load error:', err);
        const errorMsg = `Error: PDF file not found at ${pdfPath}\n\nDetails: ${err.message || err}`;
        showFlipbookError(errorMsg);
      });
    }

    // ===== Page Rendering =====
    function renderPage() {
      if (!pdfDoc) {
        showFlipbookError('Error: PDF document not loaded.');
        return;
      }
      if (pageRendering) {
        pageNumPending = currentPage;
        return;
      }
      const renderNextPage = (num) => {
        pageRendering = true;
        const canvas = document.getElementById('pageCanvas');
        const ctx = canvas.getContext('2d');
        pdfDoc.getPage(num).then(page => {
          const viewport = page.getViewport({ scale: scale });
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          canvas.style.width = '100%';
          canvas.style.height = '100%';
          const renderContext = { canvasContext: ctx, viewport: viewport };
          page.render(renderContext).promise.then(() => {
            pageRendering = false;
            currentPage = num;
            document.getElementById('pageIndicator').innerText = `Page ${currentPage} / ${pageCount}`;
            canvas.classList.add('loaded');
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('pageCanvas').style.display = 'block';
            if (pageNumPending !== null) {
              renderNextPage(pageNumPending);
              pageNumPending = null;
            }
          }).catch(err => {
            pageRendering = false;
            console.error('PDF page render error:', err);
            showFlipbookError(`Error rendering page ${num}\n\nDetails: ${err.message || err}`);
          });
        }).catch(err => {
          pageRendering = false;
          console.error('getPage error:', err);
          showFlipbookError(`Error loading page ${num}\n\nDetails: ${err.message || err}`);
        });
      };
      renderNextPage(currentPage);
    }

    function nextPage() {
      if (currentPage < pageCount) { currentPage++; renderPage(); }
    }

    function prevPage() {
      if (currentPage > 1) { currentPage--; renderPage(); }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('flipbookView')) {
        if (e.key === 'ArrowLeft') prevPage();
        if (e.key === 'ArrowRight') nextPage();
        if (e.key === 'Escape') closeFlipbook();
      }
    });

    // Touch swipe
    let touchStartX = 0;
    let touchEndX = 0;
    const pageContainer = document.getElementById('pageContainer');
    pageContainer.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);
    pageContainer.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) nextPage();
      if (touchEndX > touchStartX + 50) prevPage();
    }, false);

    // ===== Auto-Open Flipbook from ?book=<id> Query Parameter =====
    function handleBookParam() {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('book');
      if (!bookId) return;

      fetch('data/books.json')
        .then(r => r.json())
        .then(data => {
          const book = (data.books || []).find(b => b.book_id === bookId);
          if (book) {
            openFlipbook(book.pdf_path, book.title);
          } else {
            // Fallback: try to match the book_id directly to a filename
            openFlipbook(`pdfs/${bookId}.pdf`, bookId.replace(/-/g, ' '));
          }
        })
        .catch(err => {
          console.error('books.json fetch failed, using direct path:', err);
          openFlipbook(`pdfs/${bookId}.pdf`, bookId.replace(/-/g, ' '));
        });
    }

    // Initialize
    (async () => {
      handleBookParam();
    })();
  </script>
</body>
</html>
